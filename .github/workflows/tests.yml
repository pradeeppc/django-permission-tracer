name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", django: "4.2.*", drf: "3.14.*" }
          - { python: "3.10", django: "4.2.*", drf: "3.15.*" }
          - { python: "3.11", django: "5.0.*", drf: "3.15.*" }
          - { python: "3.12", django: "5.1.*", drf: "3.15.*" }
          - { python: "3.12", django: "5.2.*", drf: "3.16.*" }
          - { python: "3.13", django: "5.2.*", drf: "*" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]" "django==${{ matrix.django }}" "djangorestframework==${{ matrix.drf }}"
      - run: pytest -v
