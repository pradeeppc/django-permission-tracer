[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-permission-tracer"
dynamic = ["version"]
description = "Analyze and visualize permissions across your Django REST Framework app."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pradeep", email = "pradeep.chauhan43@gmail.com" }]
keywords = [
    "django",
    "django-rest-framework",
    "drf",
    "permissions",
    "security",
    "audit",
    "debugging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]
test = ["djangorestframework>=3.14", "pytest>=7", "pytest-django>=4.5"]
dev = ["django-permission-tracer[test]", "build", "ruff", "twine"]

[project.urls]
Homepage = "https://github.com/pradeeppc/django-permission-tracer"
Source = "https://github.com/pradeeppc/django-permission-tracer"
Issues = "https://github.com/pradeeppc/django-permission-tracer/issues"
Changelog = "https://github.com/pradeeppc/django-permission-tracer/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "permission_tracer.__version__" }

[tool.setuptools.packages.find]
include = ["permission_tracer*"]

[tool.setuptools.package-data]
permission_tracer = ["templates/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["permission_tracer"]
